/* ======================================================================
   Áudio (Web Audio API — sintetizado, sem arquivos)
   ====================================================================== */
const SND = {
  ctx: null, master: null,
  init() {
    try {
      if (!this.ctx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        this.ctx = new C();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.55;
        const warm = this.ctx.createBiquadFilter();
        warm.type = 'lowpass'; warm.frequency.value = 5200;
        const comp = this.ctx.createDynamicsCompressor();
        this.master.connect(warm); warm.connect(comp); comp.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch {}
  },
  tone(f, d, o = {}) {
    if (!this.ctx || !L.sound) return;
    const c = this.ctx, t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol ?? 0.2, t + (o.atk || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + d + 0.05);
  },
  play(name) {
    const T = (...a) => this.tone(...a);
    switch (name) {
      case 'tap': T(520, .12, { type: 'triangle', vol: .12, to: 780 }); break;
      case 'select': T(660, .1, { vol: .15 }); T(990, .2, { at: .06, vol: .1 }); break;
      case 'match':
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { T(f, .55, { at: i * .09, vol: .14 }); T(f * 2, .3, { at: i * .09, vol: .03, type: 'triangle' }); });
        break;
      case 'miss': T(392, .28, { type: 'triangle', vol: .14, to: 370 }); T(311, .45, { at: .2, type: 'triangle', vol: .12, to: 294 }); break;
      case 'win':
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => T(f, .6, { at: i * .08, vol: .13 }));
        [1567.98, 2093].forEach((f, i) => T(f, .9, { at: .45 + i * .12, vol: .05, type: 'triangle' }));
        break;
      case 'draw': [[392, 493.88], [440, 554.37]].forEach((ch, i) => ch.forEach(f => T(f, .55, { at: i * .24, vol: .1 }))); break;
      case 'tick': T(1700, .035, { type: 'square', vol: .035 }); break;
      case 'beat': T(110, .14, { vol: .5, to: 55 }); T(220, .08, { vol: .08 }); T(95, .16, { at: .15, vol: .35, to: 50 }); break;
      case 'count': T(880, .14, { vol: .12 }); break;
      case 'go': T(1320, .4, { vol: .14 }); T(660, .4, { vol: .08 }); break;
      case 'spin': T(300, .5, { type: 'triangle', vol: .07, to: 900 }); break;
      case 'join': [659.25, 880, 1318.5].forEach((f, i) => T(f, .5, { at: i * .1, vol: .12 })); break;
    }
  }
};

let S = freshState();

   Ações (rodam apenas no anfitrião ou no modo mesmo aparelho)

let wheelBusyUntil = 0;

const R = {
  go({ screen }) {
    if (S.screen === 'heart' && screen !== 'heart' && (S.hs.phase === 'play' || S.hs.phase === 'count')) {
      hsStopLoop(); S.hs.phase = 'idle';
    }
    S.screen = screen; S.msg = null;
    if (screen === 'quiz' && S.quiz.i < 0) quizNewQuestion();
  },

  quizPick({ v }, who) {
    const q = S.quiz;
    if (q.phase !== 'pick' || q.picks[who] != null) return;
    if (S.mode === 'local' && who !== q.turn) return;
    q.picks[who] = v;
    fx('select');
    if (q.picks[0] != null && q.picks[1] != null) quizReveal();
    else if (S.mode === 'local') q.phase = 'handoff';
  },
  quizReady() { const q = S.quiz; if (q.phase === 'handoff') { q.turn = 1; q.phase = 'pick'; } },
  quizNext() { quizNewQuestion(); },

  hsStart() {
    const h = S.hs;
    if (h.phase === 'play' || h.phase === 'count') return;
    Object.assign(h, { phase: 'count', count: 3.2, x: .5, y: .75, vx: 0, vy: 0, zx: .5, zy: .5, prog: 0, t: 0, inZone: false });
    S.msg = null;
    hsStartLoop();
  },

  tttMove({ i }, who) {
    const t = S.ttt;
    if (t.win != null || t.b[i] != null) return;
    if (S.mode === 'p2p' && who !== t.turn) return;
    t.b[i] = t.turn; t.lastI = i;
    const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
    const line = lines.find(l => l.every(k => t.b[k] === t.turn));
    if (line) {
      t.win = t.turn; t.line = line; t.score[t.turn]++;
      S.msg = pick(MSG.tttWin).replace(/\{w\}/g, S.names[t.turn]).replace(/\{l\}/g, S.names[1 - t.turn]);
      fx('win');
    } else if (t.b.every(c => c != null)) {
      t.win = 'draw'; t.draws++; S.points += 5;
      S.msg = pick(MSG.tttDraw);
      fx('draw');
    } else {
      t.turn ^= 1;
      fx('tap');
    }
  },
  tttReset() {
    const t = S.ttt;
    t.b = Array(9).fill(null); t.starter ^= 1; t.turn = t.starter;
    t.win = null; t.line = null; t.lastI = -1; S.msg = null;
  },

  wheelSpin() {
    const w = S.wheel;
    if (Date.now() < wheelBusyUntil) return;
    wheelBusyUntil = Date.now() + 5600;
    w.idx = Math.floor(Math.random() * PRENDAS.length);
    w.target = w.next; w.next ^= 1; w.spinId++;
    w.history.unshift({ i: w.idx, t: w.target });
    w.history = w.history.slice(0, 6);
    S.msg = null;
    fx('spin');
  },
  wheelDone() {
    const w = S.wheel;
    if (!w.spinId || w.doneId === w.spinId) return;
    w.doneId = w.spinId; S.points += 5;
    S.msg = pick(MSG.wheelDone);
    fx('match');
  }
};

/* ---------- Novos jogos: ações ---------- */
function played(id) { S.plays[id] = (S.plays[id] || 0) + 1; }
function rec(ok) { S.sync.max += 1; if (ok) S.sync.got += 1; }
const normTxt = s => String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function nextCard(c) {
  if (!c.deck.length || c.i >= c.deck.length - 1) { c.deck = shuffle(CARDS.map((_, i) => i)); c.i = 0; } else c.i++;
  return c.deck[c.i];
}
function reflexFinish() {
  const r = S.reflex;
  if (r.phase === 'done') return;
  r.phase = 'done';
  const [a, b] = r.times;
  if (a == null && b == null) { r.win = null; S.msg = 'Ninguém tocou a tempo. Tentem de novo!'; rec(false); fx('draw'); }
  else {
    r.win = a == null ? 1 : b == null ? 0 : (a <= b ? 0 : 1);
    S.points += 10; rec(true); fx('win');
    S.msg = `${S.names[r.win]} foi mais rápido!`;
  }
  played('reflex');
}
function tugEnd(w) {
  const g = S.tug;
  if (g.phase === 'end') return;
  g.phase = 'end';
  g.win = w === undefined ? (g.pos < 50 ? 0 : g.pos > 50 ? 1 : null) : w;
  played('tug');
  if (g.win == null) { S.points += 5; rec(false); S.msg = 'Empate! Puxaram com a mesma força.'; fx('draw'); }
  else { S.points += 15; rec(true); S.msg = `${S.names[g.win]} puxou mais forte!`; fx('win'); }
}
function mimeFail(txt) {
  const m = S.mime;
  m.phase = 'done'; m.ok = false; m.rounds++;
  rec(false); played('mime'); fx('miss'); S.msg = txt;
}

Object.assign(R, {
  reflexStart() {
    Object.assign(S.reflex, { phase: 'wait', t: 0, delay: 2 + Math.random() * 3, goAt: 0, times: [null, null], win: null, early: null });
    S.msg = null;
  },
  reflexTap(p, who) {
    const r = S.reflex;
    if (r.phase === 'wait') {
      r.phase = 'done'; r.early = who; r.win = 1 - who;
      S.msg = `${S.names[who]} tocou cedo demais! Ponto para ${S.names[1 - who]}.`;
      S.points += 10; rec(true); played('reflex'); fx('miss');
    } else if (r.phase === 'go' && r.times[who] == null) {
      r.times[who] = Math.round(performance.now() - r.goAt);
      fx('tap');
      if (r.times[0] != null && r.times[1] != null) reflexFinish();
    }
  },

  knowNew() {

  knowGuess(p, who) {
    const k = S.know;

    const ok = p.v === k.pick;
    k.guess = p.v; k.phase = 'reveal'; k.rounds++;
    if (ok) { k.score[1 - k.reader]++; S.points += 10; }

    S.msg = ok ? pick(MSG.match) : pick(MSG.miss);

  knowNext() { R.knowNew(); },

  drawNew() {

  },
  drawStroke(p, who) {

  cardSwap(p, who) {

    const m = S.mem;
    if (m.phase !== 'recall' || m.ans[who] != null) return;
    m.ans[who] = String(p.text ?? '').split(/[,;\n]/).map(normTxt).filter(Boolean);
    if (m.ans[0] == null || m.ans[1] == null) return;
    const ws = m.words.map(normTxt);
    m.score = m.ans.map(l => ws.filter(w => l.includes(w)).length);
    const [a, b] = m.score;
    m.phase = 'done'; S.points += 10; rec(a + b > 0); played('mem'); fx('match');
    S.msg = a === b ? `Empate com ${a} palavra${a === 1 ? '' : 's'}! Memória de elefante a dois.` : `${S.names[a > b ? 0 : 1]} lembrou de mais palavras!`;
  },
  memNext() { R.memStart(); },

  tripStart() { Object.assign(S.trip, { phase: 'pick', i: 0, picks: [null, null], log: [] }); S.msg = null; },
  tripPick(p, who) {
    const t = S.trip;
    if (t.phase !== 'pick' || t.picks[who] != null) return;
    t.picks[who] = p.v;
    if (t.picks[0] == null || t.picks[1] == null) return;
    const sc = TRIP[t.i], [a, b] = t.picks;
    let txt;
    if (a === b) { S.points += 5; rec(true); txt = `Vocês escolheram ${sc.o[a]}. No mesmo passo!`; }
    else { const c = Math.random() < .5 ? a : b; S.points += 3; rec(false); txt = `Divergiram (${sc.o[a]} x ${sc.o[b]}). O destino escolheu: ${sc.o[c]}.`; }
    t.log.push(txt); S.msg = txt; fx('select');
    if (t.i + 1 >= TRIP.length) { t.phase = 'end'; played('trip'); }
    else { t.i++; t.picks = [null, null]; }
  }
});

function gameLive() {
  return S.reflex.phase === 'wait' || S.reflex.phase === 'go' || S.tug.phase === 'play' ||
    S.mime.phase === 'play' || S.mem.phase === 'show';
}
function tickGames(dt) {
  const r = S.reflex;
  if (r.phase === 'wait') { r.t += dt; if (r.t >= r.delay) { r.phase = 'go'; r.goAt = performance.now(); commit(); } }
  else if (r.phase === 'go' && performance.now() - r.goAt > 2500) { reflexFinish(); commit(); }
  const g = S.tug;
  if (g.phase === 'play') { g.t += dt; if (g.t >= TUG_TIME) { tugEnd(); commit(); } }
  const m = S.mime;
  if (m.phase === 'play') { m.t += dt; if (m.t >= 60) { mimeFail('Tempo esgotado!'); commit(); } }
  const mm = S.mem;
  if (mm.phase === 'show') {
    mm.t += dt;
    if (mm.t >= 2) { mm.t = 0; mm.idx++; if (mm.idx >= mm.words.length) { mm.phase = 'recall'; commit(); } }
  }
}
let gTimer = null, gFrame = 0;
function ensureGTimer() {
  if (gTimer) return;
  let last = performance.now();
  gTimer = setInterval(() => {
    const now = performance.now();
    const dt = Math.min(.1, (now - last) / 1000);
    last = now;
    tickGames(dt);
    if (!gameLive()) { clearInterval(gTimer); gTimer = null; commit(); return; }
    if (++gFrame % 15 === 0) commit();
  }, 33);
}

function paintDraw() {
  const cv = $('#drawCv');
  if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = '#F7CAC9';
  for (const st of L.cur ? S.draw.strokes.concat([L.cur]) : S.draw.strokes) {
    c.beginPath();
    st.forEach((p, i) => (i ? c.lineTo(p[0] * W, p[1] * H) : c.moveTo(p[0] * W, p[1] * H)));
    c.stroke();
  }
  if (cv.dataset.bound) return;
  cv.dataset.bound = '1';
  const pos = e => { const r = cv.getBoundingClientRect(); return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]; };
  const canDraw = () => S.draw.phase === 'draw' && canAct(S.draw.drawer);
  cv.addEventListener('pointerdown', e => { if (!canDraw()) return; cv.setPointerCapture(e.pointerId); L.cur = [pos(e)]; paintDraw(); });
  cv.addEventListener('pointermove', e => { if (!L.cur) return; L.cur.push(pos(e)); paintDraw(); });
  const up = () => {
    if (!L.cur) return;
    const pts = L.cur; L.cur = null;
    if (pts.length > 1) act('drawStroke', { pts, who: S.draw.drawer }); else paintDraw();
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
}

function quizNewQuestion() {
  const q = S.quiz;
  if (!q.deck.length || q.i >= q.deck.length - 1) { q.deck = shuffle(QUESTIONS.map((_, i) => i)); q.i = 0; }
  else q.i++;
  q.picks = [null, null]; q.phase = 'pick'; q.turn = 0; q.last = null; S.msg = null;
}
function quizReveal() {
  const q = S.quiz;
  q.phase = 'reveal'; q.rounds++;
  const m = q.picks[0] === q.picks[1];
  q.last = m; S.sync.max += 1;
  if (m) { q.matches++; S.points += 10; S.sync.got += 1; fx('match'); } else fx('miss');
  S.msg = pick(m ? MSG.match : MSG.miss);
}

/* ---------- Despacho ---------- */
function act(type, p = {}) {
  if (isGuest()) { send({ t: 'act', type, p }); return; }
  apply(type, p, S.mode === 'p2p' ? me : (p.who ?? S.quiz.turn));
}
function apply(type, p, who) {
  const fn = R[type];
  if (!fn) return;
  fn(p, who);
  commit();
}
function commit() {
  afterState();
  render();
  if (S.mode === 'p2p' && me === 0) send({ t: 'state', s: S });
  if (!isGuest() && gameLive()) ensureGTimer();
}
// Efeitos derivados do estado: sons, partículas e animação da roleta
function afterState() {
  for (const f of S.fx) {
    if (f.id <= L.fxSeen) continue;
    L.fxSeen = f.id;
    SND.play(f.n);
    if (f.n === 'win' || (f.n === 'match' && S.screen === 'quiz')) burst();
  }
  if (S.wheel.spinId !== L.spinSeen) {
    L.spinSeen = S.wheel.spinId;
    startWheelAnim(S.wheel.idx, S.wheel.spinId);
  }
}

/* ======================================================================
   Heart Sync — física (anfitrião / mesmo aparelho)
   ====================================================================== */
const HS = { G: .62, DRAG: 1.25, TAP: .2, PUSH: .1, ZW: .16, ZH: .12, GOAL: 15, LIMIT: 45 };
let hsLoop = null;

function hsStartLoop() {
  if (hsLoop) return;
  let last = performance.now(), frame = 0;
  hsLoop = setInterval(() => {
    const now = performance.now();
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    hsStep(dt);
    if (++frame % 3 === 0 && S.mode === 'p2p') send({ t: 'hs', hs: S.hs });
  }, 1000 / 60);
}
function hsStopLoop() { clearInterval(hsLoop); hsLoop = null; }

function hsStep(dt) {
  const h = S.hs;
  if (h.phase === 'count') {
    h.count -= dt;
    if (h.count <= 0) { h.phase = 'play'; h.t = 0; fx('go'); commit(); }
    return;
  }
  if (h.phase !== 'play') return;
  h.t += dt;
  h.vy += HS.G * dt;
  h.vy *= 1 - HS.DRAG * dt;
  h.vx += Math.sin(h.t * .9) * .05 * dt;            // brisa suave
  h.vx *= 1 - 1.6 * dt;
  h.x += h.vx * dt; h.y += h.vy * dt;
  if (h.y > .93) { h.y = .93; h.vy = -Math.abs(h.vy) * .3; }
  if (h.y < .07) { h.y = .07; h.vy = Math.abs(h.vy) * .3; }
  if (h.x < .07) { h.x = .07; h.vx = Math.abs(h.vx) * .5; }
  if (h.x > .93) { h.x = .93; h.vx = -Math.abs(h.vx) * .5; }
  h.zx = .5 + .2 * Math.sin(h.t * .31 + 1) - .2 * Math.sin(1);
  h.zy = .5 + .18 * Math.sin(h.t * .47);
  h.inZone = Math.abs(h.x - h.zx) < HS.ZW && Math.abs(h.y - h.zy) < HS.ZH;
  h.prog = h.inZone ? h.prog + dt / HS.GOAL : Math.max(0, h.prog - dt / 40);
  if (h.prog >= 1) hsEnd(true);
  else if (h.t >= HS.LIMIT) hsEnd(false);
}
function hsTap(who) {
  const h = S.hs;
  if (h.phase !== 'play') return;
  h.vy = Math.max(-1, h.vy - HS.TAP);
  h.vx += who === 0 ? HS.PUSH : -HS.PUSH;
}
function hsEnd(win) {
  const h = S.hs;
  hsStopLoop();
  h.phase = win ? 'win' : 'lose';
  h.prog = Math.min(1, h.prog);
  h.plays++; h.best = Math.max(h.best, Math.round(h.prog * 100));
  S.sync.max += 1;
  S.sync.got += win ? 1 : h.prog * .8;
  if (win) { h.wins++; S.points += 20; }
  S.msg = pick(win ? MSG.hsWin : MSG.hsLose);
  fx(win ? 'win' : 'miss');
  commit();
}
function onTap(who, e) {
  SND.play('beat');
  const arena = $('#hsArena');
  if (arena) {
    const r = arena.getBoundingClientRect();
    L.ripples.push({ x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now(), who });
  }
  if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
  if (isGuest()) send({ t: 'tap' });
  else hsTap(S.mode === 'p2p' ? me : who);
}

/* ======================================================================
   Desenho contínuo: Heart Sync (canvas) e Roleta (animação)
   ====================================================================== */
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * .75);
  c.bezierCurveTo(x - s * 1.25, y - s * .05, x - s * .62, y - s * 1.05, x, y - s * .38);
  c.bezierCurveTo(x + s * .62, y - s * 1.05, x + s * 1.25, y - s * .05, x, y + s * .75);
  c.closePath();
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

function drawHS(now) {
  const cv = $('#hsCanvas');
  if (!cv) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  const h = S.hs;

  const k = isGuest() ? .35 : 1; // suaviza no convidado(a), que recebe ~20 atualizações/s
  L.hx += (h.x - L.hx) * k; L.hy += (h.y - L.hy) * k;
  L.zx += (h.zx - L.zx) * k; L.zy += (h.zy - L.zy) * k;

  // estrelinhas de fundo
  c.fillStyle = 'rgba(247,202,201,.18)';
  for (let i = 0; i < 28; i++) {
    const sx = (i * 97.3 % 100) / 100 * W, sy = (i * 53.7 % 100) / 100 * H;
    const tw = .5 + .5 * Math.sin(now / 900 + i);
    c.globalAlpha = .15 + tw * .35;
    c.fillRect(sx, sy, 1.6, 1.6);
  }
  c.globalAlpha = 1;

  // zona ideal
  const zw = HS.ZW * 2 * W, zh = HS.ZH * 2 * H, zx = L.zx * W - zw / 2, zy = L.zy * H - zh / 2;
  const active = h.phase === 'play' || h.phase === 'count';
  if (active) {
    c.save();
    roundRect(c, zx, zy, zw, zh, 22);
    c.fillStyle = h.inZone ? 'rgba(217,178,111,.2)' : 'rgba(247,202,201,.06)';
    if (h.inZone) { c.shadowColor = 'rgba(217,178,111,.8)'; c.shadowBlur = 30; }
    c.fill();
    c.shadowBlur = 0;
    c.setLineDash([8, 7]); c.lineDashOffset = -now / 40;
    c.lineWidth = 2;
    c.strokeStyle = h.inZone ? 'rgba(235,203,139,.95)' : 'rgba(247,202,201,.35)';
    c.stroke();
    c.restore();
    c.fillStyle = h.inZone ? 'rgba(235,203,139,.9)' : 'rgba(247,202,201,.4)';
    c.font = '600 11px "DM Sans", sans-serif'; c.textAlign = 'center';
    c.fillText('ZONA DO AMOR', zx + zw / 2, zy + 18);
  }

  // ondas dos toques
  L.ripples = L.ripples.filter(r => now - r.t < 600);
  for (const r of L.ripples) {
    const p = (now - r.t) / 600;
    c.beginPath(); c.arc(r.x, r.y, 12 + p * 50, 0, Math.PI * 2);
    c.strokeStyle = (r.who === 1 ? 'rgba(235,203,139,' : 'rgba(255,143,163,') + (1 - p) * .6 + ')';
    c.lineWidth = 2; c.stroke();
  }

  // coração
  const x = L.hx * W, y = L.hy * H, base = Math.min(W, H) * .075;
  const pulse = 1 + .08 * Math.max(0, Math.sin(now / (h.inZone ? 140 : 260)));
  const s = base * pulse;
  c.save();
  c.shadowColor = h.inZone ? 'rgba(255,170,120,.9)' : 'rgba(255,90,130,.6)';
  c.shadowBlur = h.inZone ? 40 : 22;
  const grad = c.createRadialGradient(x - s * .3, y - s * .4, s * .1, x, y, s * 1.3);
  grad.addColorStop(0, '#FFC2CF'); grad.addColorStop(.5, '#E04A6E'); grad.addColorStop(1, '#8B1E3F');
  heartPath(c, x, y, s);
  c.fillStyle = grad; c.fill();
  c.restore();
  c.beginPath(); c.ellipse(x - s * .42, y - s * .45, s * .16, s * .1, -.6, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,.55)'; c.fill();

  // contagem regressiva
  if (h.phase === 'count') {
    const n = Math.max(1, Math.ceil(h.count));
    if (n !== L.lastCount) { L.lastCount = n; SND.play('count'); }
    c.fillStyle = 'rgba(23,8,22,.45)'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#EBCB8B'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `600 ${Math.min(W, H) * .3}px Fraunces, serif`;
    c.fillText(n, W / 2, H / 2);
    c.textBaseline = 'alphabetic';
  } else L.lastCount = null;

  // HUD
  const bar = $('#hsBar'), time = $('#hsTime'), pct = $('#hsPct');
  if (bar) bar.style.width = Math.min(100, h.prog * 100) + '%';
  if (pct) pct.textContent = Math.floor(Math.min(1, h.prog) * HS.GOAL) + 's / ' + HS.GOAL + 's';
  if (time) time.textContent = h.phase === 'play' ? Math.max(0, Math.ceil(HS.LIMIT - h.t)) + 's' : HS.LIMIT + 's';
}

function startWheelAnim(idx, id) {
  if (idx == null) return;
  const seg = 360 / PRENDAS.length;
  const from = L.rot;
  let to = from - (from % 360) + 360 * 6 + ((360 - idx * seg) % 360) + (Math.random() - .5) * seg * .6;
  if (to - from < 360 * 5) to += 360;
  L.anim = { from, to, start: performance.now(), dur: 5200, id };
  const wrap = $('#wheelWrap');
  if (wrap) { wrap.classList.add('spinning'); const hub = $('#wheelHub'); if (hub) hub.disabled = true; }
}
function stepWheel(now) {
  const a = L.anim;
  if (!a) return;
  const p = Math.min(1, (now - a.start) / a.dur);
  const e = 1 - Math.pow(1 - p, 4);
  L.rot = a.from + (a.to - a.from) * e;
  const g = $('#wheelG');
  if (g) g.setAttribute('transform', `rotate(${L.rot})`);
  const seg = 360 / PRENDAS.length;
  const si = Math.floor((L.rot + seg / 2) / seg);
  if (si !== L.lastTickSeg) { L.lastTickSeg = si; if (S.screen === 'wheel') SND.play('tick'); }
  if (p >= 1) {
    L.anim = null; L.animDone = a.id;
    if (S.screen === 'wheel') { SND.play('match'); burst(['✦', '❤', '✧'], 14); }
    render();
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  stepWheel(now);
  if (S.screen === 'heart') drawHS(now);
}

/* ======================================================================
   Multiplayer P2P (PeerJS / WebRTC)
   ====================================================================== */
const PREFIX = 'duoquest-lovers-v1-';
const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let peer = null, conn = null, joinTimer = null;

function send(msg) { if (conn && conn.open) { try { conn.send(msg); } catch {} } }
function genCode() { let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }

function netCleanup() {
  clearTimeout(joinTimer);
  try { conn && conn.close(); } catch {}
  try { peer && peer.destroy(); } catch {}
  conn = null; peer = null;
}

function hostRoom() {
  if (typeof Peer === 'undefined') { toast('Não foi possível carregar o PeerJS. Verifique sua internet.'); return; }
  netCleanup();
  me = 0;
  L.code = genCode(); L.net = 'creating'; render();
  peer = new Peer(PREFIX + L.code, { debug: 0 });
  peer.on('open', () => { L.net = 'hosting'; render(); });
  peer.on('connection', c => {
    if (conn && conn.open) { c.on('open', () => c.close()); return; }
    setupConn(c);
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { hostRoom(); return; }
    L.net = 'idle'; render();
    toast('Erro de conexão: ' + (err.type || 'desconhecido'));
  });
}

function joinRoom(code) {
  if (typeof Peer === 'undefined') { toast('Não foi possível carregar o PeerJS. Verifique sua internet.'); return; }
  netCleanup();
  me = 1;
  L.net = 'joining'; render();
  peer = new Peer({ debug: 0 });
  peer.on('open', () => setupConn(peer.connect(PREFIX + code, { reliable: true, serialization: 'json' })));
  peer.on('error', err => {
    clearTimeout(joinTimer);
    L.net = 'idle'; render();
    toast(err.type === 'peer-unavailable' ? 'Sala não encontrada. Confira o código.' : 'Erro de conexão: ' + (err.type || 'desconhecido'));
  });
  joinTimer = setTimeout(() => {
    if (!conn || !conn.open) { netCleanup(); L.net = 'idle'; render(); toast('Tempo esgotado. Tente novamente.'); }
  }, 15000);
}

function setupConn(c) {
  conn = c;
  c.on('open', () => {
    clearTimeout(joinTimer);
    if (me === 1) send({ t: 'hello', name: L.myName.trim() || 'Amor' });
  });
  c.on('data', onData);
  c.on('close', onDisconnect);
  c.on('error', onDisconnect);
}

function onData(d) {
  if (!d || typeof d !== 'object') return;
  if (me === 0) {
    if (d.t === 'hello') {
      S = freshState();
      S.mode = 'p2p';
      S.names = [L.myName.trim() || 'Amor', String(d.name || 'Amor').slice(0, 20)];
      S.screen = 'menu';
      fx('join');
      commit();
      toast(`${S.names[1]} entrou na sala!`);
    } else if (d.t === 'act' && R[d.type]) apply(d.type, d.p || {}, 1);
    else if (d.t === 'tap') hsTap(1);
  } else {
    if (d.t === 'state') {
      const first = S.mode !== 'p2p';
      S = d.s;
      if (first) {
        L.fxSeen = S.fxId; L.spinSeen = S.wheel.spinId; L.animDone = S.wheel.spinId;
        SND.play('join'); toast(`Conectado com ${S.names[0]}!`);
      }
      afterState();
      render();
    } else if (d.t === 'hs') Object.assign(S.hs, d.hs);
  }
}

function onDisconnect() {
  if (!conn) return;
  const wasPlaying = S.mode === 'p2p';
  hsStopLoop();
  netCleanup();
  L.net = 'idle';
  if (wasPlaying) { S = freshState(); S.screen = 'p2p'; me = null; render(); toast('Conexão encerrada com seu par.'); }
}

const VIEWS = {

    return `
    <main class="screen flex flex-col">
      <div class="flex justify-end gap-2">${toggles()}</div>
      <div class="flex-1 flex flex-col items-center justify-center text-center py-8">
        <div class="beat mb-7 w-24 h-24 rounded-[32px] grid place-items-center"
             style="background:linear-gradient(140deg,#C2566F,#4A154B);box-shadow:0 20px 60px -15px rgba(194,86,111,.8),inset 0 1px 0 rgba(255,255,255,.3)">
          <i data-lucide="heart" class="fill-current" style="width:44px;height:44px;color:#FBE4E6"></i>
        </div>
        <p class="eyebrow mb-2">Lovers' Edition</p>
        <h1 class="font-display text-[52px] leading-none mb-4">Duo <em style="color:var(--quartz)">Quest</em></h1>
        <p class="muted max-w-xs leading-relaxed">Quatro jogos para rir, conversar e descobrir o quanto vocês estão em sintonia.</p>
      </div>
      <div class="space-y-3 fade-up">
        <button data-ui="pickLocal" class="card w-full flex items-center gap-4 p-4 text-left">
          <span class="avatar av-a" style="width:48px;height:48px"><i data-lucide="smartphone"></i></span>
          <span class="flex-1"><span class="block font-semibold">Mesmo celular</span>
          <span class="block text-sm muted">Joguem juntinhos no sofá</span></span>
          <i data-lucide="chevron-right" class="muted"></i>
        </button>
        <button data-ui="pickP2P" class="card w-full flex items-center gap-4 p-4 text-left">
          <span class="avatar av-b" style="width:48px;height:48px"><i data-lucide="wifi"></i></span>
          <span class="flex-1"><span class="block font-semibold">Dois celulares</span>
          <span class="block text-sm muted">Conectem com um código de sala</span></span>
          <i data-lucide="chevron-right" class="muted"></i>
        </button>
      </div>
    </main>`;
  },

  setup() {
    return `
    <main class="screen flex flex-col">
      <header class="flex items-center gap-2 mb-6">
        <button data-ui="home" class="icon-btn" aria-label="Voltar"><i data-lucide="arrow-left"></i></button>
        <div class="flex-1"></div>${toggles()}
      </header>
      <p class="eyebrow mb-2">Mesmo celular</p>
      <h2 class="font-display text-4xl leading-tight mb-2">Quem vai jogar hoje?</h2>
      <p class="muted mb-8">Corações para um, estrelas para o outro.</p>
      <div class="space-y-4">
        <label class="relative block">
          <i data-lucide="heart" class="fill-current absolute left-4 top-1/2 -translate-y-1/2" style="width:18px;color:#F7A8B8"></i>
          <input class="field" data-bind="n0" maxlength="20" placeholder="Nome do Jogador 1" value="${esc(L.n0)}" autocomplete="off">
        </label>
        <label class="relative block">
          <i data-lucide="star" class="fill-current absolute left-4 top-1/2 -translate-y-1/2" style="width:18px;color:#EBCB8B"></i>
          <input class="field" data-bind="n1" maxlength="20" placeholder="Nome do Jogador 2" value="${esc(L.n1)}" autocomplete="off">
        </label>
      </div>
      <div class="flex-1"></div>
      <button data-ui="saveLocal" class="btn btn-primary w-full mt-8 text-lg">Começar <i data-lucide="sparkles"></i></button>
    </main>`;
  },

  p2p() {
    let body;
    if (L.net === 'creating' || L.net === 'hosting') {
      body = `
      <div class="card p-6 text-center fade-up">
        <p class="eyebrow mb-3">Código da sala</p>
        <div class="font-display text-6xl tracking-[.25em] pl-[.25em] mb-4" style="color:#EBCB8B">${L.net === 'hosting' ? L.code : '····'}</div>
        <button data-ui="copyCode" class="btn btn-ghost text-sm py-2 px-4" ${L.net === 'hosting' ? '' : 'disabled'}><i data-lucide="copy"></i>Copiar código</button>
        <p class="muted mt-6 flex items-center justify-center gap-2"><i data-lucide="heart" class="beat fill-current" style="width:16px;color:#C2566F"></i>
          <span class="dots">${L.net === 'hosting' ? 'Aguardando seu par' : 'Abrindo a sala'}</span></p>
      </div>
      <button data-ui="cancelNet" class="btn btn-ghost w-full mt-4">Cancelar</button>`;
    } else if (L.net === 'joining') {
      body = `
      <div class="card p-8 text-center fade-up">
        <i data-lucide="heart-handshake" class="beat mx-auto mb-4" style="width:44px;height:44px;color:#EBCB8B"></i>
        <p class="font-semibold"><span class="dots">Conectando à sala ${esc(L.joinCode)}</span></p>
      </div>
      <button data-ui="cancelNet" class="btn btn-ghost w-full mt-4">Cancelar</button>`;
    } else {
      body = `
      <label class="relative block mb-6">
        <i data-lucide="user-round" class="absolute left-4 top-1/2 -translate-y-1/2 muted" style="width:18px"></i>
        <input class="field" data-bind="myName" maxlength="20" placeholder="Seu nome" value="${esc(L.myName)}" autocomplete="off">
      </label>
      <button data-ui="host" class="btn btn-primary w-full text-lg"><i data-lucide="plus"></i>Criar sala</button>
      <div class="flex items-center gap-3 my-6 muted text-sm"><span class="flex-1 h-px bg-white/10"></span>ou entre na sala do seu par<span class="flex-1 h-px bg-white/10"></span></div>
      <div class="flex gap-2">
        <label class="relative flex-1">
          <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 muted" style="width:18px"></i>
          <input class="field uppercase tracking-[.3em] font-semibold" data-bind="joinCode" maxlength="4" placeholder="CÓDIGO" value="${esc(L.joinCode)}" autocomplete="off" autocapitalize="characters">
        </label>
        <button data-ui="join" class="btn btn-gold px-5" aria-label="Entrar"><i data-lucide="log-in"></i></button>
      </div>
      <p class="text-xs muted mt-8 leading-relaxed flex gap-2"><i data-lucide="info" class="flex-none mt-0.5" style="width:14px"></i>
        A conexão é direta entre os aparelhos (WebRTC). Só o "aperto de mão" inicial usa o servidor público do PeerJS — nenhum dado do jogo é salvo.</p>`;
    }
    return `
    <main class="screen flex flex-col">
      <header class="flex items-center gap-2 mb-6">
        <button data-ui="home" class="icon-btn" aria-label="Voltar"><i data-lucide="arrow-left"></i></button>
        <div class="flex-1"></div>${toggles()}
      </header>
      <p class="eyebrow mb-2">Dois celulares</p>
      <h2 class="font-display text-4xl leading-tight mb-2">Conectem os corações</h2>
      <p class="muted mb-8">Um cria a sala, o outro entra com o código.</p>
      ${body}
    </main>`;
  },

  menu() {
    const p = syncPct();
    const stats = {
      quiz: S.quiz.rounds ? `${S.quiz.matches}/${S.quiz.rounds} combinações` : 'Novo',
      heart: S.hs.plays ? `${S.hs.wins} de ${S.hs.plays} vitórias` : 'Novo',
      ttt: (S.ttt.score[0] + S.ttt.score[1] + S.ttt.draws) ? `${S.ttt.score[0]} × ${S.ttt.score[1]}` : 'Novo',
      wheel: S.wheel.spinId ? `${S.wheel.spinId} giros` : 'Novo'
    };
    const who = S.mode === 'p2p'
      ? `<span class="pill" style="background:rgba(80,200,140,.12);border-color:rgba(80,200,140,.35);color:#9FE3BF"><i data-lucide="wifi"></i>Conectados</span>` : '';
    return `
    <main class="screen">
      <header class="flex items-center gap-2 mb-6">
        <div class="flex-1 min-w-0">
          <p class="eyebrow">Duo Quest</p>
          <h2 class="font-display text-2xl leading-tight truncate">${esc(S.names[0])} <span style="color:#C2566F">&</span> ${esc(S.names[1])}</h2>
        </div>
        ${toggles()}
      </header>

      <section class="card p-5 mb-5 fade-up">
        <div class="flex items-start justify-between mb-4">
          <div>
            <p class="eyebrow mb-1">Placar de sintonia</p>
            <p class="font-display text-5xl leading-none">${p == null ? '--' : p}<span class="text-2xl muted">%</span></p>
            <p class="text-sm mt-2" style="color:#F7D7D6">${syncLabel(p)}</p>
          </div>
          <div class="text-right">
            <p class="eyebrow mb-1">Pontos</p>
            <p class="font-display text-3xl leading-none" style="color:#EBCB8B">${S.points}</p>
            <div class="mt-3">${who}</div>
          </div>
        </div>
        <div class="meter"><div style="width:${p ?? 0}%"></div></div>
      </section>

      <div class="grid grid-cols-2 gap-3">
        ${GAMES.map((g, i) => `
          <button ${ap('go', { screen: g.id })} class="card game-card fade-up" style="animation-delay:${60 + i * 60}ms">
            <span class="gicon" style="background:${g.tint};color:${g.color}"><i data-lucide="${g.icon}"></i></span>
            <span class="block font-display text-lg leading-tight mb-1">${g.title}</span>
            <span class="block text-xs muted leading-snug mb-3">${g.sub}</span>
            <span class="block text-[11px] font-semibold" style="color:${g.color}">${stats[g.id] ?? ((S.plays[g.id] || 0) + ' partidas')}</span>
          </button>`).join('')}
      </div>

      <button data-ui="leave" class="btn btn-ghost w-full mt-6 text-sm"><i data-lucide="log-out"></i>${S.mode === 'p2p' ? 'Sair da sala' : 'Trocar jogadores'}</button>
    </main>`;
  },

  quiz() {
    const q = S.quiz, text = QUESTIONS[q.deck[q.i]] || '';
    let body = '';
    const options = who => `
      <div class="space-y-3 fade-up">
        ${[0, 1, 2].map(v => `<button ${ap('quizPick', { v, who })} class="opt">${avatar(v)}<span class="flex-1">${optLabel(v)}</span></button>`).join('')}
      </div>`;

    if (q.phase === 'pick' && S.mode === 'local') {
      body = `
        <p class="text-center text-sm mb-4" style="color:#F7D7D6"><b>${esc(S.names[q.turn])}</b>, escolha em segredo.
        ${esc(S.names[1 - q.turn])}, nada de espiar!</p>${options(q.turn)}`;
    } else if (q.phase === 'handoff') {
      body = `
        <div class="card p-6 text-center fade-up">
          <i data-lucide="repeat-2" class="mx-auto mb-3" style="width:40px;height:40px;color:#EBCB8B"></i>
          <p class="font-display text-2xl mb-1">Passe o celular</p>
          <p class="muted mb-5">para ${esc(S.names[1])} responder sem ver a resposta de ${esc(S.names[0])}.</p>
          <button ${ap('quizReady')} class="btn btn-gold w-full">Pronto, sou ${esc(S.names[1])}</button>
        </div>`;
    } else if (q.phase === 'pick') {
      const mine = q.picks[me], theirs = q.picks[1 - me];
      body = mine == null
        ? `<p class="text-center text-sm mb-4 muted">${theirs != null ? `${esc(partner())} já respondeu ✓` : 'Respondam ao mesmo tempo, cada um no seu celular.'}</p>${options(me)}`
        : `<div class="card p-8 text-center fade-up">
             <i data-lucide="hourglass" class="mx-auto mb-3" style="width:36px;height:36px;color:#EBCB8B"></i>
             <p class="font-semibold"><span class="dots">Aguardando ${esc(partner())}</span></p>
             <p class="text-sm muted mt-1">Você escolheu: ${optLabel(mine)}</p>
           </div>`;
    } else {
      const m = q.last;
      body = `
        <div class="card p-5 fade-up">
          <div class="text-center mb-5">
            <span class="pill" style="${m ? '' : 'background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:var(--ink)'}">
              <i data-lucide="${m ? 'sparkles' : 'shuffle'}"></i>${m ? 'Combinaram! +10' : 'Divergiram'}</span>
          </div>
          <div class="grid grid-cols-2 gap-3">
            ${[0, 1].map(p => `
              <div class="text-center rounded-2xl p-3" style="background:rgba(0,0,0,.2)">
                <p class="text-xs muted mb-2">${esc(S.names[p])} disse</p>
                <div class="flex justify-center mb-2">${avatar(q.picks[p])}</div>
                <p class="font-semibold text-sm">${optLabel(q.picks[p])}</p>
              </div>`).join('')}
          </div>
        </div>
        ${msgCard()}
        <button ${ap('quizNext')} class="btn btn-primary w-full mt-5">Próxima pergunta <i data-lucide="arrow-right"></i></button>`;
    }
    return `
    <main class="screen">
      ${hdr('Sintonia do Casal')}
      <div class="flex items-center justify-between text-xs muted mb-3 px-1">
        <span>Pergunta ${q.rounds + (q.phase === 'reveal' ? 0 : 1)}</span>
        <span>${q.matches}/${q.rounds} combinações</span>
      </div>
      <section class="card p-6 mb-5 text-center relative overflow-hidden">
        <i data-lucide="quote" class="absolute -top-1 left-3 opacity-10" style="width:60px;height:60px"></i>
        <p class="eyebrow mb-3">Quem é mais provável...</p>
        <h3 class="font-display text-[26px] leading-snug">${esc(text)}</h3>
      </section>
      ${body}
    </main>`;
  },

  heart() {
    const h = S.hs, playing = h.phase === 'play' || h.phase === 'count';
    let overlay = '';
    if (!playing) {
      const res = h.phase === 'win' || h.phase === 'lose';
      overlay = `
      <div class="absolute inset-0 grid place-items-center p-5" style="background:rgba(23,8,22,.55)">
        <div class="text-center max-w-xs fade-up">
          ${res ? `
            <i data-lucide="${h.phase === 'win' ? 'trophy' : 'heart-crack'}" class="mx-auto mb-3" style="width:44px;height:44px;color:${h.phase === 'win' ? '#EBCB8B' : '#F7A8B8'}"></i>
            <p class="font-display text-3xl mb-1">${h.phase === 'win' ? 'Em perfeita sintonia!' : 'O coração escapou'}</p>
            <p class="muted text-sm mb-1">${Math.round(Math.min(1, h.prog) * 100)}% da meta</p>
            ${msgCard()}` : `
            <i data-lucide="heart-pulse" class="beat mx-auto mb-3" style="width:44px;height:44px;color:#FF8FA3"></i>
            <p class="font-display text-3xl mb-3">Heart Sync</p>
            <p class="text-sm leading-relaxed mb-1" style="color:#F7D7D6">Cada toque faz o coração subir e o empurra para o lado do par.</p>
            <p class="text-sm muted leading-relaxed">Toquem juntos, no ritmo, para mantê-lo na <b style="color:#EBCB8B">zona do amor</b> por ${HS.GOAL} segundos.</p>`}
          <button ${ap('hsStart')} class="btn btn-primary mt-6 px-8">${res ? 'Jogar de novo' : 'Começar'} <i data-lucide="play"></i></button>
        </div>
      </div>`;
    }
    let taps = '';
    if (playing) {
      taps = S.mode === 'local'
        ? `<div class="tapzone left-0 w-1/2" data-tap="0" style="border-right:1px dashed rgba(247,202,201,.12)"><span style="color:#F7A8B8">♥ ${esc(S.names[0])}</span></div>
           <div class="tapzone right-0 w-1/2" data-tap="1"><span style="color:#EBCB8B">★ ${esc(S.names[1])}</span></div>`
        : `<div class="tapzone inset-x-0" data-tap="${me}"><span style="color:${me === 0 ? '#F7A8B8' : '#EBCB8B'}">Toque em qualquer lugar, ${esc(S.names[me])}</span></div>`;
    }
    return `
    <main class="screen flex flex-col" style="height:100dvh;min-height:0">
      ${hdr('Heart Sync')}
      <div class="mb-3">
        <div class="flex justify-between text-xs mb-1.5 px-1">
          <span class="font-semibold" style="color:#EBCB8B">Sintonia <span id="hsPct"></span></span>
          <span class="muted flex items-center gap-1"><i data-lucide="timer" style="width:13px"></i><span id="hsTime"></span></span>
        </div>
        <div class="meter"><div id="hsBar" style="width:0;transition:none"></div></div>
      </div>
      <div class="arena" id="hsArena">
        <canvas id="hsCanvas" class="absolute inset-0 w-full h-full"></canvas>
        ${taps}${overlay}
      </div>
      <div class="flex justify-around text-center text-xs muted pt-3">
        <span>Partidas <b class="block text-base" style="color:var(--ink)">${h.plays}</b></span>
        <span>Vitórias <b class="block text-base" style="color:var(--ink)">${h.wins}</b></span>
        <span>Recorde <b class="block text-base" style="color:var(--ink)">${h.best}%</b></span>
      </div>
    </main>`;
  },

  ttt() {
    const t = S.ttt;
    const sym = (v, i) => v == null ? '' :
      `<i data-lucide="${v === 0 ? 'heart' : 'star'}" class="fill-current ${i === t.lastI ? 'pop' : ''}" style="color:${v === 0 ? '#F07A97' : '#EBCB8B'}"></i>`;
    const canPlay = t.win == null && (S.mode === 'local' || t.turn === me);
    let status;
    if (t.win === 'draw') status = 'Deu velha!';
    else if (t.win != null) status = `${esc(S.names[t.win])} venceu!`;
    else if (S.mode === 'p2p') status = t.turn === me ? 'Sua vez!' : `<span class="dots">Vez de ${esc(partner())}</span>`;
    else status = `Vez de ${esc(S.names[t.turn])}`;
    const player = p => `
      <div class="flex-1 card p-3 text-center transition" style="${t.win == null && t.turn === p ? `border-color:${p === 0 ? 'rgba(240,122,151,.6)' : 'rgba(235,203,139,.6)'};box-shadow:0 0 24px -8px ${p === 0 ? 'rgba(240,122,151,.8)' : 'rgba(235,203,139,.8)'}` : ''}">
        <div class="flex justify-center mb-1">${avatar(p)}</div>
        <p class="text-xs truncate muted">${esc(S.names[p])}</p>
        <p class="font-display text-2xl">${t.score[p]}</p>
      </div>`;
    return `
    <main class="screen">
      ${hdr('Jogo da Velha')}
      <div class="flex gap-3 items-stretch mb-5">
        ${player(0)}
        <div class="flex flex-col justify-center text-center px-1"><p class="text-[10px] muted uppercase tracking-wider">Empates</p><p class="font-display text-xl">${t.draws}</p></div>
        ${player(1)}
      </div>
      <p class="text-center font-semibold mb-4" style="color:#F7D7D6">${status}</p>
      <div class="grid grid-cols-3 gap-3 max-w-[340px] mx-auto">
        ${t.b.map((v, i) => `<button class="cell ${t.line && t.line.includes(i) ? 'win' : ''}" ${canPlay && v == null ? ap('tttMove', { i }) : 'disabled'} aria-label="Casa ${i + 1}">${sym(v, i)}</button>`).join('')}
      </div>
      ${msgCard()}
      ${t.win != null ? `<button ${ap('tttReset')} class="btn btn-primary w-full mt-5"><i data-lucide="rotate-ccw"></i>Nova partida</button>` : ''}
    </main>`;
  },

  wheel() {
    const w = S.wheel, n = PRENDAS.length, seg = 360 / n;
    const pt = (a, r) => { const rad = a * Math.PI / 180; return `${(r * Math.sin(rad)).toFixed(2)},${(-r * Math.cos(rad)).toFixed(2)}`; };
    const colors = ['#5A1A55', '#8B2346', '#3B1238', '#B04A66'];
    const segs = PRENDAS.map((p, i) => {
      const a0 = (i - .5) * seg, a1 = (i + .5) * seg;
      return `<path d="M0,0 L${pt(a0, 140)} A140,140 0 0,1 ${pt(a1, 140)} Z" fill="${colors[i % 4]}" stroke="rgba(217,178,111,.5)" stroke-width="1"/>
        <text transform="rotate(${i * seg - 90}) translate(96,0)" text-anchor="middle" dominant-baseline="middle"
          fill="#FBE4E6" font-size="11.5" font-weight="600" font-family="DM Sans, sans-serif">${p.short}</text>`;
    }).join('');
    const bulbs = Array.from({ length: 24 }, (_, i) => { const [x, y] = pt(i * 15, 147).split(','); return `<circle class="bulb" cx="${x}" cy="${y}" r="2.6"/>`; }).join('');
    const spinning = !!L.anim;
    const shown = w.idx != null && !spinning && L.animDone === w.spinId;
    let result = '';
    if (shown) {
      const pz = PRENDAS[w.idx];
      const txt = esc(pz.txt).replace(/\{a\}/g, `<b>${esc(S.names[w.target])}</b>`).replace(/\{b\}/g, `<b>${esc(S.names[1 - w.target])}</b>`);
      const done = w.doneId === w.spinId;
      result = `
      <div class="card p-5 mt-6 fade-up">
        <div class="flex items-center gap-3 mb-3">
          <span class="avatar ${pz.type === 'premio' ? 'av-b' : 'av-a'}"><i data-lucide="${pz.icon}"></i></span>
          <div><p class="eyebrow">${pz.type === 'premio' ? 'Prêmio' : 'Prenda'}</p><p class="font-display text-xl leading-tight">${pz.short}</p></div>
        </div>
        <p class="leading-relaxed" style="color:#F7D7D6">${txt}</p>
        ${done ? msgCard() : `<button ${ap('wheelDone')} class="btn btn-gold w-full mt-4"><i data-lucide="check"></i>Cumprido! +5</button>`}
      </div>`;
    }
    const hist = w.history.slice(shown || !w.spinId ? (shown ? 1 : 0) : 1, 6);
    return `
    <main class="screen">
      ${hdr('Roleta do Amor')}
      <p class="text-center text-sm mb-5 muted">${spinning ? 'Girando para' : 'Próximo giro para'}
        <b style="color:#F7D7D6">${esc(S.names[spinning ? w.target : w.next])}</b></p>
      <div class="wheel-wrap ${spinning ? 'spinning' : ''}" id="wheelWrap">
        <div class="wheel-pointer"></div>
        <svg viewBox="-152 -152 304 304" aria-hidden="true">
          <circle r="151" fill="#2D112B" stroke="#D9B26F" stroke-width="3"/>
          <g id="wheelG" transform="rotate(${L.rot})">${segs}</g>
          <circle r="140" fill="none" stroke="rgba(217,178,111,.7)" stroke-width="1.5"/>
          <g>${bulbs}</g>
        </svg>
        <button id="wheelHub" ${ap('wheelSpin')} class="wheel-hub" ${spinning ? 'disabled' : ''}>GIRAR</button>
      </div>
      ${result}
      ${hist.length ? `
        <div class="mt-6">
          <p class="eyebrow mb-2 px-1">Últimos giros</p>
          <div class="flex flex-wrap gap-2">${hist.map(x => `<span class="pill" style="background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--muted)">${PRENDAS[x.i].short} · ${esc(S.names[x.t])}</span>`).join('')}</div>
        </div>` : ''}
    </main>`;
  }
};

/* ---------- Novos jogos: telas ---------- */
const canAct = seat => S.mode === 'local' || me === seat;
const seatFor = turn => (S.mode === 'p2p' ? me : turn);
const ptap = (type, p = {}) => `data-ptap="${type}" data-pp='${JSON.stringify(p)}'`;
const wrap = (title, inner) => `<main class="screen">${hdr(title)}${inner}</main>`;
const startBtn = (type, label = 'Começar') =>
  `<div class="card p-6 text-center fade-up"><button ${ap(type)} class="btn btn-primary w-full text-lg">${label} <i data-lucide="play"></i></button></div>`;
function pads(type, labels) {
  if (S.mode === 'local') return `
    <div class="tapzone left-0 w-1/2" ${ptap(type, { who: 0 })} style="border-right:1px dashed rgba(247,202,201,.15)"><span style="color:#F7A8B8">${labels[0]}</span></div>
    <div class="tapzone right-0 w-1/2" ${ptap(type, { who: 1 })}><span style="color:#EBCB8B">${labels[1]}</span></div>`;
  return `<div class="tapzone inset-x-0" ${ptap(type, { who: me })}><span style="color:${me === 0 ? '#F7A8B8' : '#EBCB8B'}">${labels[me]}</span></div>`;
}

Object.assign(VIEWS, {
  reflex() {
    const r = S.reflex;
    if (r.phase === 'idle' || r.phase === 'done') {
      const res = r.phase === 'done' ? `
        <section class="card p-5 text-center fade-up mb-4">
          <p class="font-display text-2xl mb-1">${r.win == null ? 'Sem vencedor' : esc(S.names[r.win]) + ' venceu!'}</p>
          <p class="muted text-sm">${r.times.map((t, i) => `${esc(S.names[i])}: ${t == null ? '—' : t + ' ms'}`).join(' · ')}</p>${msgCard()}
        </section>` : '';
      return wrap('Reflexo Duplo', `${res}
        <div class="card p-6 text-center">
          <i data-lucide="zap" class="mx-auto mb-3" style="width:40px;height:40px;color:#EBCB8B"></i>
          <p class="muted mb-5">Quando o sinal aparecer, toquem o mais rápido possível. Tocar antes do sinal entrega o ponto ao par.</p>
          <button ${ap('reflexStart')} class="btn btn-primary w-full text-lg">${r.phase === 'done' ? 'Jogar de novo' : 'Começar'} <i data-lucide="play"></i></button>
        </div>`);
    }
    const go = r.phase === 'go';
    return wrap('Reflexo Duplo', `
      <p class="text-center font-display text-4xl mb-4 ${go ? 'beat' : ''}" style="color:${go ? '#EBCB8B' : '#F7CAC9'}">${go ? 'TOQUE!' : 'Espere o sinal...'}</p>
      <div class="arena" style="min-height:320px">${pads('reflexTap', [`Toque, ${esc(S.names[0])}`, `Toque, ${esc(S.names[1])}`])}</div>`);
  },

  know() {
    const k = S.know;
    if (k.phase === 'idle') return wrap('Quem Conhece Quem', startBtn('knowNew'));
    const q = KNOW[k.deck[k.i]], rd = k.reader, gs = 1 - rd;
    const head = `<section class="card p-5 mb-4 text-center">
        <p class="eyebrow mb-2">${esc(S.names[rd])} responde sobre si mesmo(a)</p>
        <h3 class="font-display text-2xl leading-snug">${esc(q.q)}</h3></section>`;
    const opts = (type, who) => q.o.map((o, v) => `<button class="opt mb-3" ${ap(type, { v, who })}><span class="flex-1">${esc(o)}</span></button>`).join('');
    let body;
    if (k.phase === 'pick') body = canAct(rd) ? opts('knowPick', seatFor(rd)) : `<p class="muted text-center dots">Aguardando ${esc(S.names[rd])} escolher</p>`;
    else if (k.phase === 'handoff') body = `<div class="card p-6 text-center fade-up">
        <p class="font-display text-2xl mb-2">Passe o celular</p>
        <p class="muted mb-5">${esc(S.names[gs])}, agora adivinhe a resposta de ${esc(S.names[rd])}.</p>
        <button ${ap('knowReady')} class="btn btn-gold w-full">Pronto</button></div>`;
    else if (k.phase === 'guess') body = canAct(gs)
      ? `<p class="text-center text-sm mb-3 muted">${esc(S.names[gs])}, adivinhe a resposta de ${esc(S.names[rd])}:</p>` + opts('knowGuess', seatFor(gs))
      : `<p class="muted text-center dots">Aguardando ${esc(S.names[gs])} adivinhar</p>`;
    else body = `<div class="card p-5 fade-up">
        <p class="text-sm muted mb-1">${esc(S.names[rd])} disse:</p><p class="font-semibold mb-3">${esc(q.o[k.pick])}</p>
        <p class="text-sm muted mb-1">${esc(S.names[gs])} chutou:</p><p class="font-semibold">${esc(q.o[k.guess])}</p></div>
        ${msgCard()}
        <button ${ap('knowNext')} class="btn btn-primary w-full mt-5">Próxima pergunta <i data-lucide="arrow-right"></i></button>`;
    return wrap('Quem Conhece Quem', head + body);
  },

  draw() {
    const d = S.draw;
    if (d.phase === 'idle') return wrap('Desenhe e Adivinhe', startBtn('drawNew'));
    const dr = canAct(d.drawer), gs = canAct(1 - d.drawer);
    let info = '', ctrl = '';
    if (d.phase === 'draw') {
      info = dr ? `Desenhe: <b style="color:#EBCB8B">${esc(d.word)}</b>` : `<span class="dots">${esc(S.names[d.drawer])} está desenhando</span>`;
      if (dr) ctrl = `<button ${ap('drawDone', { who: seatFor(d.drawer) })} class="btn btn-gold w-full mt-3"><i data-lucide="check"></i>Terminei</button>`;
    } else if (d.phase === 'guess') {
      info = gs ? 'O que está sendo desenhado?' : `<span class="dots">${esc(S.names[1 - d.drawer])} está adivinhando</span>`;
      if (gs) ctrl = `<div class="flex gap-2 mt-3">
          <input class="field" data-bind="draft" value="${esc(L.draft)}" placeholder="Seu palpite" autocomplete="off" style="padding-left:1rem">
          <button ${ap('drawGuess', { who: seatFor(1 - d.drawer) })} data-draft class="btn btn-gold px-5">Enviar</button></div>`;
    } else {
      info = d.ok ? 'Acertou!' : 'Não foi dessa vez';
      ctrl = `${msgCard()}<button ${ap('drawNext')} class="btn btn-primary w-full mt-4">Próxima rodada <i data-lucide="arrow-right"></i></button>`;
    }
    return wrap('Desenhe e Adivinhe', `
      <p class="text-center mb-3" style="color:#F7D7D6">${info}</p>
      <div class="arena" style="min-height:300px;aspect-ratio:1/1;flex:none"><canvas id="drawCv" class="absolute inset-0 w-full h-full" style="touch-action:none"></canvas></div>
      ${ctrl}`);
  },

  tug() {
    const g = S.tug;
    if (g.phase === 'idle') return wrap('Cabo de Guerra', startBtn('tugStart'));
    const bar = `
      <div class="relative h-7 rounded-full overflow-hidden mb-2" style="background:linear-gradient(90deg,#8B1E3F 0%,#8B1E3F ${100 - g.pos}%,#B8893F ${100 - g.pos}%,#B8893F 100%);box-shadow:inset 0 0 0 1px rgba(247,202,201,.15)">
        <div class="absolute top-0 bottom-0 w-1 bg-white/80" style="left:${100 - g.pos}%"></div></div>
      <div class="flex justify-between text-xs mb-4"><span style="color:#F7A8B8">${esc(S.names[0])}</span><span style="color:#EBCB8B">${esc(S.names[1])}</span></div>`;
    const time = g.phase === 'play' ? `<p class="text-center text-sm muted mb-3">Tempo: ${Math.max(0, Math.ceil(TUG_TIME - g.t))}s</p>` : '';
    const inner = g.phase === 'play'
      ? `<div class="arena" style="min-height:300px">${pads('tugTap', [`← Puxe, ${esc(S.names[0])}`, `Puxe, ${esc(S.names[1])} →`])}</div>`
      : `<div class="card p-5 text-center fade-up mb-4"><p class="font-display text-2xl">${g.win == null ? 'Empate!' : esc(S.names[g.win]) + ' venceu!'}</p>${msgCard()}</div>
         <button ${ap('tugStart')} class="btn btn-primary w-full">Jogar de novo <i data-lucide="rotate-ccw"></i></button>`;
    return wrap('Cabo de Guerra', bar + time + inner);
  },

  frase() {
    const f = S.frase;
    if (f.phase === 'idle') return wrap('Batalha de Frases', startBtn('fraseNew'));
    const prompt = `<section class="card p-5 mb-4 text-center"><p class="eyebrow mb-2">Complete a frase</p><h3 class="font-display text-2xl leading-snug">${esc(f.prompt)}</h3></section>`;
    let body;
    if (f.phase === 'write') {
      const w = S.mode === 'p2p' ? me : (f.texts[0] == null ? 0 : 1);
      const can = S.mode === 'local' || f.texts[me] == null;
      body = can
        ? `<p class="text-center text-sm muted mb-2">${esc(S.names[w])}, escreva sua continuação</p>
           <textarea class="field" data-bind="draft" rows="3" maxlength="140" placeholder="Sua continuação..." style="padding-left:1rem">${esc(L.draft)}</textarea>
           <button ${ap('fraseWrite', { who: w })} data-draft class="btn btn-gold w-full mt-3">Enviar</button>`
        : `<p class="muted text-center dots">Aguardando ${esc(partner())} escrever</p>`;
    } else if (f.phase === 'vote') {
      const v = S.mode === 'p2p' ? me : (f.votes[0] == null ? 0 : 1);
      const can = S.mode === 'local' || f.votes[me] == null;
      body = f.texts.map((t, i) => `<div class="card p-4 mb-3"><p class="eyebrow mb-1">Resposta ${'AB'[i]}</p><p class="mb-3">${esc(t)}</p>
          ${can ? `<button ${ap('fraseVote', { v: i, who: v })} class="btn btn-ghost w-full">Esta é a melhor</button>` : ''}</div>`).join('')
        + (can ? '' : `<p class="muted text-center dots">Aguardando ${esc(partner())} votar</p>`);
    } else {
      body = f.texts.map((t, i) => `<div class="card p-4 mb-3"><p class="eyebrow mb-1">${esc(S.names[i])} escreveu</p><p>${esc(t)}</p></div>`).join('')
        + msgCard()
        + `<button ${ap('fraseNext')} class="btn btn-primary w-full mt-4">Próxima frase <i data-lucide="arrow-right"></i></button>`;
    }
    return wrap('Batalha de Frases', prompt + body);
  },

  mime() {
    const m = S.mime;
    if (m.phase === 'idle') return wrap('Mímica Romântica', startBtn('mimeNew'));
    const an = S.names[m.actor], ac = canAct(m.actor), sx = seatFor(m.actor);
    let inner;
    if (m.phase === 'ready') {
      inner = ac
        ? `<section class="card p-6 text-center"><p class="eyebrow mb-2">Só ${esc(an)} vê</p>
           <p class="font-display text-4xl mb-4" style="color:#EBCB8B">${esc(m.word)}</p>
           <p class="muted text-sm mb-5">Faça a mímica sem falar. Quando estiver pronto, comece o cronômetro.</p>
           <button ${ap('mimeStart', { who: sx })} class="btn btn-primary w-full">Começar mímica <i data-lucide="play"></i></button></section>`
        : `<section class="card p-6 text-center"><p class="dots">Aguardando ${esc(an)} se preparar</p></section>`;
    } else if (m.phase === 'play') {
      const showWord = S.mode === 'p2p' && me === m.actor;
      inner = `<section class="card p-6 text-center"><p class="eyebrow mb-2">${esc(an)} está atuando</p>
          ${showWord ? `<p class="font-display text-2xl mb-2" style="color:#EBCB8B">${esc(m.word)}</p>` : ''}
          <p class="muted text-sm">Tempo: ${Math.max(0, Math.ceil(60 - m.t))}s</p></section>
        ${ac
          ? `<div class="grid grid-cols-2 gap-3 mt-4"><button ${ap('mimeHit', { who: sx })} class="btn btn-gold">Acertou!</button><button ${ap('mimePass', { who: sx })} class="btn btn-ghost">Pular</button></div>`
          : '<p class="muted text-center text-sm mt-4">Quem adivinha, grita a resposta!</p>'}`;
    } else {
      inner = `<section class="card p-6 text-center fade-up"><p class="font-display text-2xl mb-1">${m.ok ? 'Acertou!' : 'Não foi dessa vez'}</p>
          <p class="muted">A palavra era <b>${esc(m.word)}</b></p>${msgCard()}</section>
        <button ${ap('mimeNext')} class="btn btn-primary w-full mt-4">Próxima palavra <i data-lucide="arrow-right"></i></button>`;
    }
    return wrap('Mímica Romântica', inner);
  },

  cards() {
    const c = S.cards;
    if (c.phase === 'idle') return wrap('Sorte ou Desafio', startBtn('cardsNew'));
    const tn = S.names[c.turn], mine = canAct(c.turn), sx = seatFor(c.turn);
    let inner;
    if (c.phase === 'draw') {
      inner = `<section class="card p-6 text-center">
          <i data-lucide="layers" class="mx-auto mb-3" style="width:40px;height:40px;color:#EBCB8B"></i>
          <p class="font-display text-2xl mb-4">Vez de ${esc(tn)}</p>
          ${mine ? `<button ${ap('cardDraw', { who: sx })} class="btn btn-primary w-full">Tirar uma carta</button>` : '<p class="dots muted">Aguardando</p>'}</section>`;
    } else {
      inner = mine
        ? `<section class="card p-6 text-center fade-up"><p class="eyebrow mb-3">Carta para ${esc(tn)}</p>
           <p class="font-display text-2xl leading-snug mb-5">${esc(CARDS[c.card])}</p>
           <button ${ap('cardDo', { who: sx })} class="btn btn-gold w-full mb-3"><i data-lucide="check"></i>Cumpri! +5</button>
           ${c.swapped ? '' : `<button ${ap('cardSwap', { who: sx })} class="btn btn-ghost w-full"><i data-lucide="shuffle"></i>Trocar carta (uma vez)</button>`}</section>`
        : `<section class="card p-6 text-center"><p class="dots muted">${esc(tn)} está com uma carta</p></section>`;
    }
    return wrap('Sorte ou Desafio', inner + msgCard());
  },

  mem() {
    const m = S.mem;
    if (m.phase === 'idle') return wrap('Quem Erra Menos', startBtn('memStart'));
    let inner;
    if (m.phase === 'show') {
      inner = `<section class="card p-8 text-center fade-up"><p class="eyebrow mb-4">Memorize · ${m.idx + 1} de ${m.words.length}</p>
        <p class="font-display text-5xl" style="color:#EBCB8B">${esc(m.words[m.idx] ?? '')}</p></section>`;
    } else if (m.phase === 'recall') {
      const w = S.mode === 'p2p' ? me : (m.ans[0] == null ? 0 : 1);
      const can = S.mode === 'local' || m.ans[me] == null;
      inner = `<section class="card p-5 mb-4 text-center"><p class="muted text-sm">Escreva as palavras que lembrar, separadas por vírgula.</p></section>`
        + (can
          ? `<p class="text-center text-sm mb-2">${esc(S.names[w])}, sua vez</p>
             <textarea class="field" data-bind="draft" rows="3" placeholder="casa, praia, pizza..." style="padding-left:1rem">${esc(L.draft)}</textarea>
             <button ${ap('memAnswer', { who: w })} data-draft class="btn btn-gold w-full mt-3">Enviar lembranças</button>`
          : `<p class="muted text-center dots">Aguardando ${esc(partner())}</p>`);
    } else {
      inner = `<section class="card p-5 fade-up"><p class="font-display text-2xl text-center mb-3">${esc(S.names[0])} ${m.score[0]} × ${m.score[1]} ${esc(S.names[1])}</p>
        <p class="muted text-sm text-center">Palavras: ${m.words.map(esc).join(', ')}</p>${msgCard()}</section>
        <button ${ap('memStart')} class="btn btn-primary w-full mt-4">Jogar de novo <i data-lucide="rotate-ccw"></i></button>`;
    }
    return wrap('Quem Erra Menos', inner);
  },

  trip() {
    const t = S.trip;
    if (t.phase === 'idle') return wrap('Viagem a Dois', startBtn('tripStart'));
    if (t.phase === 'end') return wrap('Viagem a Dois', `
      <section class="card p-5 mb-4 fade-up"><p class="eyebrow mb-3">Sua viagem</p>
        <ol class="space-y-2 text-sm pl-5" style="color:#F7D7D6;list-style:decimal">${t.log.map(l => `<li>${esc(l)}</li>`).join('')}</ol></section>
      ${msgCard()}
      <button ${ap('tripStart')} class="btn btn-primary w-full mt-4">Nova viagem <i data-lucide="rotate-ccw"></i></button>`);
    const sc = TRIP[t.i];
    const w = S.mode === 'p2p' ? me : (t.picks[0] == null ? 0 : 1);
    const can = S.mode === 'local' || t.picks[me] == null;
    return wrap('Viagem a Dois', `
      <p class="eyebrow mb-2 text-center">Cena ${t.i + 1} de ${TRIP.length}</p>
      <section class="card p-5 mb-4 text-center"><h3 class="font-display text-2xl leading-snug">${esc(sc.q)}</h3></section>
      ${can
        ? `<p class="text-center text-sm muted mb-3">Vez de ${esc(S.names[w])}</p>` + sc.o.map((o, v) => `<button class="opt mb-3" ${ap('tripPick', { v, who: w })}><span class="flex-1">${esc(o)}</span></button>`).join('')
        : `<p class="muted text-center dots">Aguardando ${esc(partner())}</p>`}
      ${msgCard()}`);
  }
});

function render() {
  const v = VIEWS[S.screen] || VIEWS.welcome;
  $('#app').innerHTML = v();
  paintDraw();
  if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } });
  document.body.classList.toggle('cozy', L.cozy);
}

/* ---------- Ações locais (não sincronizadas) ---------- */
const UI = {
  home() { netCleanup(); me = null; L.net = 'idle'; S = freshState(); render(); },
  pickLocal() { S.screen = 'setup'; render(); },
  pickP2P() { S.screen = 'p2p'; L.net = 'idle'; render(); },
  saveLocal() {
    const a = L.n0.trim(), b = L.n1.trim();
    if (!a || !b) { toast('Digitem os dois nomes para começar.'); return; }
    if (a.toLowerCase() === b.toLowerCase()) { toast('Usem nomes diferentes para não confundir o placar.'); return; }
    store.set('n0', a); store.set('n1', b);
    S = freshState(); me = null;
    S.mode = 'local'; S.names = [a, b]; S.screen = 'menu';
    SND.play('join');
    render();
  },
  host() {
    if (!L.myName.trim()) { toast('Digite seu nome primeiro.'); return; }
    store.set('myName', L.myName.trim());
    hostRoom();
  },
  join() {
    const code = L.joinCode.trim().toUpperCase();
    if (!L.myName.trim()) { toast('Digite seu nome primeiro.'); return; }
    if (code.length !== 4) { toast('O código tem 4 caracteres.'); return; }
    store.set('myName', L.myName.trim());
    L.joinCode = code;
    joinRoom(code);
  },
  cancelNet() { netCleanup(); me = null; L.net = 'idle'; render(); },
  copyCode() {
    const done = () => toast('Código copiado! Envie para seu par.');
    if (navigator.clipboard) navigator.clipboard.writeText(L.code).then(done, () => toast('Código: ' + L.code));
    else toast('Código: ' + L.code);
  },
  cozy() { L.cozy = !L.cozy; store.set('cozy', L.cozy); render(); toast(L.cozy ? 'Modo aconchego ligado' : 'Modo aconchego desligado', 1500); },
  sound() { L.sound = !L.sound; store.set('sound', L.sound); if (L.sound) SND.play('select'); render(); },
  leave() {
    if (!confirm(S.mode === 'p2p' ? 'Sair da sala e encerrar a partida?' : 'Voltar ao início? O placar desta sessão será zerado.')) return;
    hsStopLoop();
    const wasP2P = S.mode === 'p2p';
    if (wasP2P) { const c = conn; conn = null; try { c && c.close(); } catch {} netCleanup(); }
    me = null; L.net = 'idle';
    S = freshState();
    S.screen = wasP2P ? 'p2p' : 'setup';
    render();
  }
};

/* ---------- Eventos ---------- */
document.addEventListener('pointerdown', e => {
  SND.init();
  const tz = e.target.closest('[data-tap]');
  if (tz) { e.preventDefault(); onTap(+tz.dataset.tap, e); return; }
  const pz = e.target.closest('[data-ptap]');
  if (pz) {
    e.preventDefault();
    let p = {};
    try { p = JSON.parse(pz.dataset.pp || '{}'); } catch {}
    act(pz.dataset.ptap, p);
  }
}, { passive: false });

document.addEventListener('click', e => {
  const u = e.target.closest('[data-ui]');
  if (u) { SND.play('tap'); UI[u.dataset.ui] && UI[u.dataset.ui](u); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) {
    let p = {};
    try { p = JSON.parse(a.dataset.p || '{}'); } catch {}
    if (a.dataset.draft !== undefined) { p.text = L.draft; L.draft = ''; }
    if (a.dataset.act !== 'quizPick' && a.dataset.act !== 'tttMove') SND.play('tap');
    act(a.dataset.act, p);
  }
});

document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.bind;
  if (!k) return;
  if (k === 'joinCode') {
    const v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    if (v !== e.target.value) e.target.value = v;
    L[k] = v;
  } else L[k] = e.target.value;
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.dataset || !e.target.dataset.bind) return;
  const k = e.target.dataset.bind;
  if (k === 'joinCode') UI.join();
  else if (k === 'myName') UI.host();
  else if (k === 'n1' || k === 'n0') UI.saveLocal();
});

// Brasas do modo aconchego
(function makeEmbers() {
  const box = $('#embers');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    s.style.animationDuration = (9 + Math.random() * 10) + 's';
    s.style.animationDelay = (-Math.random() * 18) + 's';
    const sz = 3 + Math.random() * 5;
    s.style.width = s.style.height = sz + 'px';
    box.appendChild(s);
  }
})();

window.addEventListener('beforeunload', () => { try { conn && conn.close(); peer && peer.destroy(); } catch {} });

render();
requestAnimationFrame(loop);
</script>
</body>
</html>
